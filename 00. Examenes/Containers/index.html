<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContenedEx</title>
    <script src="script.js" defer></script>
    <style>
      .contenido-principal {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .seccion-tabla,
      #panel-logs {
        flex: 1;
      }

      #panel-logs {
        flex: 1;
        border: 2px solid black;
        padding: 10px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }

      th,
      td {
        border: 1px solid black;
        padding: 6px;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Contenedores</h1>
      <form>
        <label for="referencia">Referencia:</label>
        <input type="text" id="referencia" />

        <label for="peso">Peso (Kg):</label>
        <input type="text" id="peso" />

        <label for="volumen">Volumen (m³):</label>
        <input type="text" id="volumen" />

        <button type="button" id="agregar" class="btn">Añadir</button>
        <button type="button" id="editar" class="btn">Modificar</button>
        <button type="button" id="calcular" class="btn">Calcular</button>
      </form>

      <div class="contenido-principal">
        <section class="seccion-tabla">
          <button type="button" id="btn-alta-densidad" class="btn">
            Mostrar Alta Densidad
          </button>

          <table id="tabla-alta-densidad" hidden>
            <thead>
              <tr>
                <th>Referencia</th>
                <th>Densidad</th>
              </tr>
            </thead>
            <tbody id="container-list"></tbody>
          </table>
        </section>

        <aside id="panel-logs">
          <h2>Logs</h2>
          <div id="logs"></div>
        </aside>
      </div>
    </main>
  </body>
</html>
